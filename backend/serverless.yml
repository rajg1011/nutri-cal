service: express-lambda
useDotenv: true

provider:
  name: aws
  region: ap-south-1
  runtime: nodejs20.x
  memorySize: 512
  timeout: 29
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    SUPABASE_PROJECT_URL: ${env:SUPABASE_PROJECT_URL}
    SUPABASE_SUPER_ADMIN: ${env:SUPABASE_SUPER_ADMIN}
    SUPABASE_ANON_KEY: ${env:SUPABASE_ANON_KEY}
    RAZORPAY_API_KEY: ${env:RAZORPAY_API_KEY}
    RAZORPAY_SECRET: ${env:RAZORPAY_SECRET}
    RAZORPAY_PLAN_ID_199: ${env:RAZORPAY_PLAN_ID_199}
    CRYPTO_SECRET: ${env:CRYPTO_SECRET}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET}
    UPSTASH_REDIS_REST_URL: ${env:UPSTASH_REDIS_REST_URL}
    UPSTASH_REDIS_REST_TOKEN: ${env:UPSTASH_REDIS_REST_TOKEN}
    LANGFUSE_SECRET_KEY: ${env:LANGFUSE_SECRET_KEY}
    LANGFUSE_PUBLIC_KEY: ${env:LANGFUSE_PUBLIC_KEY}
    LANGFUSE_BASE_URL: ${env:LANGFUSE_BASE_URL}
    RESEND_API_KEY: ${env:RESEND_API_KEY}
    RESEND_SENDER_EMAIL: ${env:RESEND_SENDER_EMAIL}
    NOTIFICATIONS_QUEUE_URL: ${env:NOTIFICATIONS_QUEUE_URL}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - arn:aws:sqs:ap-south-1:840869896762:nutrical-messages
  deploymentBucket:
    maxPreviousDeploymentArtifacts: 3

functions:
  app:
    handler: handler.handler
    events:
      - httpApi: '*'

  notificationWorker:
    handler: workers/notificationWorker.handler
    events:
      - sqs:
          arn: arn:aws:sqs:ap-south-1:840869896762:nutrical-messages
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

package:
  patterns:
    - '!.env'
    - '!.env.*'     
    - '!README.md'
    - '!.gitignore'
