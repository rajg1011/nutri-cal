<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#21b86d" />
    <title>Calorie Tracker Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg-color: #f4f8f6;
        --card-bg: #ffffff;
        --text-primary: #1e332a;
        --text-secondary: #748c82;
        --primary-green: #21b86d;
        --border-color: #e2e8e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg-color);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--card-bg);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.5;
      }

      button {
        min-height: 44px;
        margin-top: 22px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: var(--primary-green);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>Calorie Tracker is installed, but this screen needs a connection before it can sync your latest data.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
